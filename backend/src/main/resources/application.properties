spring.application.name=devresolve
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/devresolve?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT_MS:30000}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.data-source-properties.sslMode=${DB_SSL_MODE:DISABLED}

app.jwt.secret=${JWT_SECRET:c3VwZXJzZWNyZXRzdXBlcnNlY3JldHN1cGVyc2VjcmV0MTIzNDU2}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.gemini.api-key=${GEMINI_API_KEY:disabled}
app.gemini.api-url=${GEMINI_API_URL:https://generativeai.googleapis.com/v1/models/gemini-2.0-flash:generateContent}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Jackson
spring.jackson.default-property-inclusion=non_null
